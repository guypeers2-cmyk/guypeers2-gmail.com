name: Bouwprijscalculator → Cloudflare Worker

on:
  push:
    branches:
      - arena/c5fdb0b8-guypeers2-gmail-com
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python + JS-pariteit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Unittests (Python-kern + pariteit met de Workers-rekenkern)
        run: python3 -m unittest discover -s bouwcalculator/tests -v

  deploy:
    name: Deployen naar Cloudflare Workers
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Deployen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy
      - name: URL tonen
        run: echo "https://${{ vars.WORKER_NAME || 'patient-sun-c959' }}.guypeers2.workers.dev"
